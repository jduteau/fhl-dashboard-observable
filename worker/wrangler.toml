name = "fhl-roster-moves"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
GITHUB_REPO = "jduteau/fhl-dashboard-observable"
# Origins (no paths) allowed to call the Worker, comma-separated: the GitHub Pages site first, then the local
# `npm run dev` preview (Observable Framework serves on port 3000, on either host name).
ALLOWED_ORIGIN = "https://jduteau.github.io,http://127.0.0.1:3000,http://localhost:3000"

# Trade emails through EmailJS (see README). Service id and public key are the same ones the old Roster page used
# (the public key is public by design). EMAILJS_TEMPLATE_ID is the new trade-email template: until it is filled in, and
# the EMAILJS_PRIVATE_KEY secret is set, no emails are sent. SITE_URL is the dashboard address used for links.
EMAILJS_SERVICE_ID = "service_k8uynjg"
EMAILJS_PUBLIC_KEY = "m2JaSdtXv7JaHBl7r"
EMAILJS_TEMPLATE_ID = "template_spwr299"
SITE_URL = "https://jduteau.github.io/fhl-dashboard-observable/"
# League-wide address (mailing list / group) that is told whenever a trade is accepted. Leave blank for no league email.
LEAGUE_EMAIL = "fhltalk@googlegroups.com"

# Trade proposals (see schema.sql). Create with `npx wrangler d1 create fhl-trades`, then paste its id here.
[[d1_databases]]
binding = "DB"
database_name = "fhl-trades"
database_id = "be3a0438-a199-4728-a8cb-15165546276f"
