name: Apply Roster Moves

on:
  # Triggered by the Cloudflare Worker (worker/index.js) after it verifies the GM's password.
  repository_dispatch:
    types: [roster-moves]
  # Commissioner: create rosters_pNN.csv for the next period from the stored moves.
  workflow_dispatch:
    inputs:
      materialize:
        description: "Write rosters_pNN.csv for the next period from stored moves"
        type: boolean
        default: true

# Serialize runs so simultaneous submissions don't collide on push.
concurrency:
  group: apply-moves
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the branch as it is NOW, not the commit it pointed at when the dispatch was sent: a run that waited in
      # the concurrency queue would otherwise start from a stale tree, miss the previous run's commit and conflict on push.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Store submitted moves
        if: github.event_name == 'repository_dispatch'
        env:
          MOVES: ${{ toJson(github.event.client_payload) }}
        run: node .github/scripts/apply-moves.mjs
      - name: Materialize next-period roster
        if: github.event_name == 'workflow_dispatch' && inputs.materialize
        run: node .github/scripts/apply-moves.mjs materialize
      - name: Commit
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/static
          git diff --cached --quiet && exit 0
          git commit -m "Roster moves ($EVENT)"
          # Another workflow may have pushed meanwhile; retry the rebase+push a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
