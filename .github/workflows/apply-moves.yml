name: Apply Roster Moves

on:
  # Triggered by the Cloudflare Worker (worker/index.js) after it verifies the GM's password.
  repository_dispatch:
    types: [roster-moves]
  # Commissioner: create rosters_pNN.csv for the next period from the stored moves.
  workflow_dispatch:
    inputs:
      materialize:
        description: "Write rosters_pNN.csv for the next period from stored moves"
        type: boolean
        default: true

# Runs are NOT queued behind each other for roster moves: GitHub keeps only one pending run per concurrency group, so a
# third submission arriving while one run executes and one waits would silently cancel the waiting one and lose that
# team's moves. Instead every submission gets its own group (so none is cancelled) and the commit step below redoes
# its work on top of the latest branch tip whenever a push is rejected, so parallel runs can't conflict.
# The commissioner's materialize runs stay serialized with each other.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'apply-moves-materialize' || format('apply-moves-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply and commit
        if: github.event_name == 'repository_dispatch' || inputs.materialize
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
          MOVES: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each attempt starts from the newest branch tip and applies the change again, so a push that loses a race
          # with another run is simply redone on top of that run's commit (no merge, no conflict). A script failure
          # (e.g. the moves are invalid) is real, not a race, so it fails the run straight away.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch --depth=1 origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if [ "$EVENT" = "repository_dispatch" ]; then
              node .github/scripts/apply-moves.mjs || exit 1
            else
              node .github/scripts/apply-moves.mjs materialize || exit 1
            fi
            git add src/data/static
            git diff --cached --quiet && exit 0
            git commit -m "Roster moves ($EVENT)"
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 3))
          done
          exit 1
