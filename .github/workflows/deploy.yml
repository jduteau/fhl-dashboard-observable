name: Deploy

on:
  # Run this workflow whenever a new commit is pushed to main.
  push: {branches: [master]}
  # Run this workflow after Read Stats completes (pushes made with GITHUB_TOKEN
  # don't trigger the push event above).
  workflow_run:
    workflows: ["Read Stats"]
    types: [completed]
  # Run this workflow once per day, at 10:15 UTC
  # schedule: [{cron: "15 10 * * *"}]
  # Run this workflow when triggered manually in GitHub’s UI.
  workflow_dispatch: {}

jobs:
  deploy:
    # For workflow_run, only deploy if Read Stats succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
