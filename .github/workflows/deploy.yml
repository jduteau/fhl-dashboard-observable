name: Deploy

on:
  # Run this workflow whenever a new commit is pushed to main.
  push: {branches: [master]}
  # Run this workflow after Read Stats, Apply Roster Moves, Record Trades, Record Transactions or Add Player completes (pushes made with
  # GITHUB_TOKEN don't trigger the push event above).
  workflow_run:
    workflows: ["Read Stats", "Apply Roster Moves", "Record Trades", "Record Transactions", "Add Player"]
    types: [completed]
  # Run this workflow once per day, at 10:15 UTC
  # schedule: [{cron: "15 10 * * *"}]
  # Run this workflow when triggered manually in GitHub’s UI.
  workflow_dispatch: {}

# One deploy at a time; a run that starts while another is deploying waits its turn (the last one queued wins), so an
# older build can never overwrite a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and test, then hand the site to the deploy job as a Pages artifact. Kept separate from the deploy so the artifact is
  # fully stored before anything looks for it (deploying in the same job occasionally fails with 'No artifacts named
  # "github-pages" were found for this workflow run'), and so a failed deploy can be re-run on its own, without rebuilding.
  build:
    # For workflow_run, only deploy if the triggering workflow succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Nothing is deployed unless the tests pass: a bad commit (code or data) leaves the live site as it was
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build # skipped too when build is skipped
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
