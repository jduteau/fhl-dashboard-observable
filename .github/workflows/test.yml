name: Test

# Pushes to master are checked by the Deploy workflow, which runs the same tests (and the build) before it deploys.
# This one checks pull requests and can be run by hand; it also builds the site, since the data loaders only run then.
on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
