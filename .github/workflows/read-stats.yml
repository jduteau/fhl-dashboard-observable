name: Read Stats

on:
  # Run daily at 13:00 UTC (9am EDT / 8am EST).
  schedule:
    - cron: "0 13 * * *"
  # Run this workflow when triggered manually in GitHub's UI.
  workflow_dispatch:
    inputs:
      season:
        description: "Season override (default: current=true row in seasons.csv)"
        required: false
      period:
        description: "Period override (default: period in progress per periods.csv)"
        required: false

jobs:
  read-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve season and period
        id: resolve
        # Inputs go through env, never straight into the script text (shell injection).
        env:
          SEASON_INPUT: ${{ inputs.season }}
          PERIOD_INPUT: ${{ inputs.period }}
        run: node .github/scripts/resolve-period.mjs "$SEASON_INPUT" "$PERIOD_INPUT"
      - uses: pnpm/action-setup@v4
        if: steps.resolve.outputs.period != ''
        with:
          package_json_file: FHLScripts/package.json
      - name: Build FHLScripts
        if: steps.resolve.outputs.period != ''
        working-directory: FHLScripts
        run: |
          pnpm install --frozen-lockfile
          # lib/ is gitignored, so compile the TypeScript via projen first
          pnpm exec projen compile
      - name: Read stats
        if: steps.resolve.outputs.period != ''
        env:
          SEASON: ${{ steps.resolve.outputs.season }}
          YEAR: ${{ steps.resolve.outputs.year }}
          PERIOD: ${{ steps.resolve.outputs.period }}
          NEXT_PERIOD: ${{ steps.resolve.outputs.next_period }}
        run: |
          node ./FHLScripts/lib/readStatsIndex.js "$YEAR" fhl_stats_overall
          mkdir -p "src/data/static/${SEASON}/stats"
          cp fhl_stats_overall.csv "src/data/static/${SEASON}/stats/stats_p${PERIOD}.csv"
          # On a period's last day this is its final stats drop; the same file also starts the next period
          if [ -n "$NEXT_PERIOD" ]; then
            cp fhl_stats_overall.csv "src/data/static/${SEASON}/stats/stats_p${NEXT_PERIOD}.csv"
          fi
      - name: Add new players to player_info.csv
        if: steps.resolve.outputs.period != ''
        continue-on-error: true
        env:
          SEASON: ${{ steps.resolve.outputs.season }}
          PERIOD: ${{ steps.resolve.outputs.period }}
        run: node .github/scripts/update-player-info.mjs "$SEASON" "$PERIOD"
      - name: Commit updated stats
        if: steps.resolve.outputs.period != ''
        env:
          SEASON: ${{ steps.resolve.outputs.season }}
          PERIOD: ${{ steps.resolve.outputs.period }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/static
          git diff --cached --quiet && exit 0
          git commit -m "Update stats for $SEASON period $PERIOD"
          # Another workflow may have pushed meanwhile; retry the rebase+push a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
