name: Add Player

on:
  # Triggered by the Cloudflare Worker (worker/players.js) when the commissioner adds a player to player_info.csv.
  # The Worker checks the request first, and add-player.mjs checks it again.
  repository_dispatch:
    types: [add-player]

# Serialize runs (they all edit player_info.csv); kept separate from the other workflows so none can replace another's queued run
# (GitHub keeps only one pending run per concurrency group).
concurrency:
  group: add-player
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the branch as it is NOW, not the commit it pointed at when the dispatch was sent: a run that waited in
      # the concurrency queue would otherwise start from a stale tree, miss the previous run's commit and conflict on push.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add player
        env:
          ADD_PLAYER: ${{ toJson(github.event.client_payload) }}
        run: node .github/scripts/add-player.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/static
          git diff --cached --quiet && exit 0
          git commit -m "Add player (repository_dispatch)"
          # Another workflow may have pushed meanwhile; retry the rebase+push a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
